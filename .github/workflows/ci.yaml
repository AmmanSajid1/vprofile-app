name: VProfile CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn --batch-mode clean verify

      - name: Build Docker image
        run: docker build -f Docker-files/app/Dockerfile -t vprofile-app:test .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464209272334:role/vprofile-app-github-ci
          aws-region: us-east-1

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if Docker image exists in ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name vprofile-app \
            --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image already exists in ECR."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image not found in ECR."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: vprofile-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag vprofile-app:test \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"