name: VProfile CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn --batch-mode clean verify

      - name: Build application Docker image
        run: docker build -f Docker-files/app/Dockerfile -t vprofile-app:test .

      - name: Build Flyway Docker image
        run: docker build -f Docker-files/flyway/Dockerfile -t vprofile-flyway:test .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::464209272334:role/vprofile-app-github-ci
          aws-region: us-east-1

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Application image

      - name: Check if application image exists in ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name vprofile-app \
            --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2> ecr-error.txt; then

            echo "Image already exists in ECR."
            echo "exists=true" >> "$GITHUB_OUTPUT"

          elif grep -q "ImageNotFoundException" ecr-error.txt; then

            echo "Image does not exist in ECR."
            echo "exists=false" >> "$GITHUB_OUTPUT"

          else

            echo "Unexpected AWS ECR error:"
            cat ecr-error.txt
            exit 1

          fi

      - name: Tag and push application image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: vprofile-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag vprofile-app:test \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Flyway migration image

      - name: Check if Flyway image exists in ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-flyway-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name vprofile-flyway \
            --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2> flyway-ecr-error.txt; then

            echo "Flyway image already exists in ECR."
            echo "exists=true" >> "$GITHUB_OUTPUT"

          elif grep -q "ImageNotFoundException" flyway-ecr-error.txt; then

            echo "Flyway image does not exist in ECR."
            echo "exists=false" >> "$GITHUB_OUTPUT"

          else

            echo "Unexpected AWS ECR error:"
            cat flyway-ecr-error.txt
            exit 1

          fi

      - name: Tag and push Flyway image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-flyway-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: vprofile-flyway
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag vprofile-flyway:test \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Generate GitOps GitHub App token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gitops-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: AmmanSajid1
          repositories: vprofile-gitops

      - name: Verify GitOps repository access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          gh repo view AmmanSajid1/vprofile-gitops \
            --json nameWithOwner \
            --jq '.nameWithOwner'

      - name: Checkout GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: AmmanSajid1/vprofile-gitops
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Install Kustomize
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Update dev image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops/apps/vprofile/overlays/dev

          kustomize edit set image \
            "464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app=464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-app:$IMAGE_TAG" \
            "464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-flyway=464209272334.dkr.ecr.us-east-1.amazonaws.com/vprofile-flyway:$IMAGE_TAG"

          echo "Updated image references:"
          grep -A6 '^images:' kustomization.yaml

      - name: Create GitOps image update PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd gitops

          BRANCH="ci/update-dev-images-${IMAGE_TAG}"

          git config user.name "vprofile-gitops-automation[bot]"
          git config user.email "vprofile-gitops-automation[bot]@users.noreply.github.com"
          # Check whether this commit already has a GitOps branch
          if git ls-remote --exit-code \
            "https://x-access-token:${GH_TOKEN}@github.com/AmmanSajid1/vprofile-gitops.git" \
            "refs/heads/$BRANCH" > /dev/null; then

            echo "GitOps branch already exists. Checking for an open PR."

          else
            git switch -c "$BRANCH"
            git add apps/vprofile/overlays/dev/kustomization.yaml

            if git diff --cached --quiet; then
              echo "No image changes required."
              exit 0
            fi

            git commit -m "ci: update dev image tags to $IMAGE_TAG"

            git push \
              "https://x-access-token:${GH_TOKEN}@github.com/AmmanSajid1/vprofile-gitops.git" \
              "$BRANCH"
          fi

          PR_NUMBER=$(gh pr list \
            --repo AmmanSajid1/vprofile-gitops \
            --head "AmmanSajid1:$BRANCH" \
            --base main \
            --state all \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "GitOps PR #$PR_NUMBER already exists. No duplicate required."
          else
            gh pr create \
              --repo AmmanSajid1/vprofile-gitops \
              --head "AmmanSajid1:$BRANCH" \
              --base main \
              --title "ci: deploy application $IMAGE_TAG to dev" \
              --body "Updates the vProfile application and Flyway images to commit $IMAGE_TAG.

          Both images were built and published successfully by the application CI pipeline."
          fi